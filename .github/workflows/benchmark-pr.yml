name: Benchmark PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    env:
      BENCHMARK_GROUP: ${{ matrix.benchmark_group }}
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        include:
          - id: decompress-binary
            label: Decompress binary
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:binary.lzma'
          - id: decompress-chinese
            label: Decompress Chinese text
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:chinese.txt.lzma'
          - id: decompress-large-kjv
            label: Decompress large KJV text
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:large-kjv.txt.lzma'
          - id: decompress-large-random-binary
            label: Decompress large random binary
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:large-random_binary.lzma'
          - id: decompress-level-1
            label: Decompress level 1 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 1.lzma'
          - id: decompress-level-2
            label: Decompress level 2 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 2.lzma'
          - id: decompress-level-3
            label: Decompress level 3 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 3.lzma'
          - id: decompress-level-4
            label: Decompress level 4 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 4.lzma'
          - id: decompress-level-5
            label: Decompress level 5 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 5.lzma'
          - id: decompress-level-6
            label: Decompress level 6 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 6.lzma'
          - id: decompress-level-7
            label: Decompress level 7 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 7.lzma'
          - id: decompress-level-8
            label: Decompress level 8 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 8.lzma'
          - id: decompress-level-9
            label: Decompress level 9 fixture
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:level 9.lzma'
          - id: decompress-no-progress
            label: Decompress no-progress text
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:no_progress.txt.lzma'
          - id: decompress-sample-text
            label: Decompress sample text
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:sample_text.txt.lzma'
          - id: decompress-timeseries
            label: Decompress time-series text
            file: tests/compression.bench.ts
            benchmark_group: 'decompress:timeseries.txt.lzma'
          - id: compress-sample-text
            label: Compress sample text at every mode
            file: tests/compression.bench.ts
            benchmark_group: 'compress:sample_text.txt'
          - id: compress-chinese
            label: Compress Chinese text at every mode
            file: tests/compression.bench.ts
            benchmark_group: 'compress:chinese.txt'
          - id: compress-binary
            label: Compress binary data at every mode
            file: tests/compression.bench.ts
            benchmark_group: 'compress:binary'
          - id: compress-timeseries
            label: Compress time-series text at every mode
            file: tests/compression.bench.ts
            benchmark_group: 'compress:timeseries.txt'
          - id: execution-small-compression
            label: Execution modes for small-text compression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:execution-small-compression'
          - id: execution-small-decompression
            label: Execution modes for small-text decompression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:execution-small-decompression'
          - id: execution-large-compression
            label: Execution modes for large-text compression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:execution-large-compression'
          - id: execution-large-decompression
            label: Execution modes for large-text decompression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:execution-large-decompression'
          - id: libraries-small-compression
            label: Libraries for small-text compression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:libraries-small-compression'
          - id: libraries-large-compression
            label: Libraries for large-text compression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:libraries-large-compression'
          - id: libraries-small-decompression
            label: Libraries for small-text decompression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:libraries-small-decompression'
          - id: libraries-large-decompression
            label: Libraries for large-text decompression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:libraries-large-decompression'
          - id: libraries-binary-compression
            label: Libraries for binary compression
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:libraries-binary-compression'
          - id: compression-ratio
            label: Compression-ratio report
            file: tests/comparison.bench.ts
            benchmark_group: 'comparison:compression-ratio'

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate modules
        run: pnpm generate

      - name: Run benchmarks on PR branch
        run: pnpm test:bench "${{ matrix.file }}" || true

      - name: Save PR benchmark results
        run: |
          if [ -f bench-results.json ]; then
            cp bench-results.json /tmp/pr-results.json
          fi

      - name: Save selected benchmark harness
        run: cp "${{ matrix.file }}" /tmp/selected-benchmark.bench.ts

      - name: Checkout main branch
        run: |
          git stash --include-untracked || true
          git checkout origin/main

      - name: Detect main branch package manager
        run: |
          PACKAGE_MANAGER=$(node -p "const pm = require('./package.json').packageManager || ''; pm ? pm.split('@')[0] : 'npm'")
          echo "MAIN_PACKAGE_MANAGER=$PACKAGE_MANAGER" >> "$GITHUB_ENV"

      - name: Install dependencies on main with pnpm
        run: pnpm install --frozen-lockfile
        if: env.MAIN_PACKAGE_MANAGER == 'pnpm'

      - name: Install dependencies on main with Yarn
        if: env.MAIN_PACKAGE_MANAGER == 'yarn'
        run: corepack yarn install --immutable

      - name: Install dependencies on main with npm
        if: env.MAIN_PACKAGE_MANAGER == 'npm'
        run: npm ci

      - name: Generate modules on main with pnpm
        if: env.MAIN_PACKAGE_MANAGER == 'pnpm'
        run: |
          if [ -f scripts/generate-modules.js ]; then
            pnpm generate
          fi
        continue-on-error: true

      - name: Generate modules on main with Yarn
        if: env.MAIN_PACKAGE_MANAGER == 'yarn'
        run: |
          if [ -f scripts/generate-modules.js ]; then
            corepack yarn generate
          fi
        continue-on-error: true

      - name: Generate modules on main with npm
        if: env.MAIN_PACKAGE_MANAGER == 'npm'
        run: |
          if [ -f scripts/generate-modules.js ]; then
            npm run generate
          fi
        continue-on-error: true

      - name: Ensure benchmark.outputJson is configured
        run: |
          if ! grep -q 'outputJson' vitest.config.ts 2>/dev/null; then
            sed -i "s/include: \['tests\/\*\*\/\*.bench.ts'\]/include: ['tests\/\*\*\/*.bench.ts'], outputJson: 'bench-results.json'/" vitest.config.ts || true
          fi

      - name: Restore selected benchmark harness
        run: cp /tmp/selected-benchmark.bench.ts "${{ matrix.file }}"

      - name: Run benchmarks on main branch with pnpm
        run: pnpm test:bench "${{ matrix.file }}" || true
        if: env.MAIN_PACKAGE_MANAGER == 'pnpm'

      - name: Run benchmarks on main branch with Yarn
        if: env.MAIN_PACKAGE_MANAGER == 'yarn'
        run: corepack yarn test:bench "${{ matrix.file }}" || true

      - name: Run benchmarks on main branch with npm
        if: env.MAIN_PACKAGE_MANAGER == 'npm'
        run: npm run test:bench -- "${{ matrix.file }}" || true

      - name: Save main benchmark results
        run: |
          if [ -f bench-results.json ]; then
            cp bench-results.json /tmp/main-results.json
          fi

      - name: Checkout PR branch again
        uses: actions/checkout@v4

      - name: Install dependencies for comparison
        run: pnpm install --frozen-lockfile

      - name: Restore benchmark results
        run: |
          if [ -f /tmp/pr-results.json ]; then
            cp /tmp/pr-results.json pr-results.json
          fi
          if [ -f /tmp/main-results.json ]; then
            cp /tmp/main-results.json main-results.json
          fi

      - name: Generate comparison report
        run: |
          if [ -f pr-results.json ] && [ -f main-results.json ]; then
            node scripts/compare-benchmarks.js || {
              echo "## 📊 Benchmark Comparison" > benchmark-comparison.md
              echo "" >> benchmark-comparison.md
              echo "⚠️ Benchmark comparison could not be generated." >> benchmark-comparison.md
            }
          else
            echo "## 📊 Benchmark Comparison" > benchmark-comparison.md
            echo "" >> benchmark-comparison.md
            if [ ! -f pr-results.json ]; then
              echo "⚠️ PR benchmarks did not produce results." >> benchmark-comparison.md
            fi
            if [ ! -f main-results.json ]; then
              echo "⚠️ Main branch benchmarks did not produce results (this may be expected for new features)." >> benchmark-comparison.md
            fi
          fi
          sed -i "1s|.*|## 📊 ${{ matrix.label }}|" benchmark-comparison.md
          mv benchmark-comparison.md "${{ matrix.id }}-benchmark-comparison.md"

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report-${{ matrix.id }}
          path: ${{ matrix.id }}-benchmark-comparison.md
          if-no-files-found: warn
          retention-days: 7

  comment:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download comparison reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: benchmark-report-*
          path: benchmark-reports
          merge-multiple: true

      - name: Combine comparison reports
        run: |
          shopt -s nullglob
          reports=(benchmark-reports/*.md)

          if [ "${#reports[@]}" -gt 0 ]; then
            {
              for report in "${reports[@]}"; do
                cat "$report"
                echo
                echo "---"
                echo
              done
            } > benchmark-comparison.md
          else
            echo "⚠️ Benchmark comparison reports could not be generated." > benchmark-comparison.md
          fi

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const COMMENT_MARKER = '<!-- lzma-benchmark-comment -->';

            let body;
            if (fs.existsSync('benchmark-comparison.md')) {
              body = fs.readFileSync('benchmark-comparison.md', 'utf8');
            } else {
              body = '⚠️ Benchmark comparison could not be generated. This may be expected if the main branch has a different structure.';
            }

            const timestamp = new Date().toISOString();
            const suffix = `\n\n<sub>Last updated: ${timestamp}</sub>`;
            const truncationNotice = '\n\n*Report truncated to fit GitHub’s comment limit; the full reports are available as workflow artifacts.*';
            const maxCommentLength = 65_000;
            const availableBodyLength = maxCommentLength - COMMENT_MARKER.length - suffix.length - 1;

            if (body.length > availableBodyLength) {
              body = `${body.slice(0, availableBodyLength - truncationNotice.length)}${truncationNotice}`;
            }

            body = `${COMMENT_MARKER}\n${body}${suffix}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const benchmarkComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes(COMMENT_MARKER)
            );

            if (benchmarkComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: benchmarkComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
